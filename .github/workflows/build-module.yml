name: Build Android Hook Module

on:
  push:
    branches: [ main ]
    paths:
      - 'android-module/**'
      - '.github/workflows/build-module.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-module/**'
      - '.github/workflows/build-module.yml'

jobs:
  build:
    name: Build Sniffer APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android-module/gradlew

      - name: Build Release APK
        working-directory: android-module
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Sniffer APK
        uses: actions/upload-artifact@v4
        with:
          name: com.wx.sniffer-release
          path: android-module/app/build/outputs/apk/release/*.apk
