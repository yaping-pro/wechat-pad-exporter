name: Build Android Hook Module

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'android-module/**'
      - '.github/workflows/build-module.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-module/**'
      - '.github/workflows/build-module.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Sniffer APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android-module/gradlew

      - name: Decode Android Release Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Release APK
        working-directory: android-module
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare Named Release Assets and Verify Signature
        run: |
          mkdir -p release-assets
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.3}"
          SRC_APK=$(ls android-module/app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ]; then
            echo "::error::Release APK not found in android-module/app/build/outputs/apk/release/"
            exit 1
          fi
          TARGET_APK="release-assets/wechat-pad-exporter-module-${TAG_NAME}.apk"
          cp "$SRC_APK" "$TARGET_APK"
          echo "Prepared asset: $TARGET_APK ($(ls -lh "$TARGET_APK" | awk '{print $5}'))"

          echo "Verifying APK Signature..."
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$TARGET_APK"
          else
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$TARGET_APK" || \
            find $ANDROID_HOME/build-tools/ -name apksigner -exec {} verify --verbose "$TARGET_APK" \;
          fi

          # Hard gate: must contain META-INF signing cert
          if ! unzip -l "$TARGET_APK" | grep -E "META-INF/.*\.(RSA|DSA|EC)"; then
            echo "::error::APK signature verification failed: No META-INF signature certificate found!"
            exit 1
          fi
          echo "Signature verification passed successfully!"
      - name: Upload Sniffer APK
        uses: actions/upload-artifact@v4
        with:
          name: com.wx.sniffer-release
          path: release-assets/*.apk
          if-no-files-found: error
