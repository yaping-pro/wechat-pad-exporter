name: Build Android Hook Module

on:
  push:
    branches: [ main ]
    paths:
      - 'android-module/**'
      - '.github/workflows/build-module.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-module/**'
      - '.github/workflows/build-module.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Sniffer APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android-module/gradlew

      - name: Setup Keystore (Official or Transient Debug Keystore for Fork PRs)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding official release keystore..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "KEYSTORE_SOURCE=official" >> $GITHUB_ENV
          else
            echo "No secret keystore found (fork PR or unconfigured secret). Generating transient keystore..."
            keytool -genkeypair -v -keystore /tmp/release.keystore \
              -alias androiddebugkey -keypass android -storepass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEYSTORE_SOURCE=transient" >> $GITHUB_ENV
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Release APK
        working-directory: android-module
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
      - name: Prepare Named Release Assets and Verify Signature
        run: |
          mkdir -p release-assets
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            TAG_NAME="${GITHUB_REF_NAME//\//-}"
          fi
          TAG_NAME="${TAG_NAME:-v1.0.4}"
          SRC_APK=$(ls android-module/app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ]; then
            echo "::error::Release APK not found in android-module/app/build/outputs/apk/release/"
            exit 1
          fi
          TARGET_APK="release-assets/wechat-pad-exporter-module-${TAG_NAME}.apk"
          cp "$SRC_APK" "$TARGET_APK"
          echo "Prepared asset: $TARGET_APK ($(ls -lh "$TARGET_APK" | awk '{print $5}'))"

          echo "Verifying APK Signature..."
          APKSIGNER="apksigner"
          if ! command -v apksigner >/dev/null 2>&1; then
            APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | head -n 1)
          fi
          "$APKSIGNER" verify --verbose "$TARGET_APK"

          # Verify zipalign 4-byte alignment
          ZIPALIGN="zipalign"
          if ! command -v zipalign >/dev/null 2>&1; then
            ZIPALIGN=$(find $ANDROID_HOME/build-tools/ -name zipalign | head -n 1)
          fi
          if [ -n "$ZIPALIGN" ] && [ -x "$ZIPALIGN" ]; then
            echo "Checking zipalign 4-byte alignment..."
            "$ZIPALIGN" -c -v 4 "$TARGET_APK"
            echo "Zipalign verification passed!"
          fi

          if [ "$KEYSTORE_SOURCE" = "official" ]; then
            echo "Asserting release cert fingerprint against official release cert..."
            RAW_DIGEST=$("$APKSIGNER" verify --print-certs "$TARGET_APK" | grep -i "SHA-256 digest:" | head -1 | awk '{print $NF}' | tr -d ' :')
            EXPECTED_RAW="76ADA629EA2A12C67767225215632B19F83178F34F92C279E6446EBC258430C1"
            CERT_FINGERPRINT=$(echo "$RAW_DIGEST" | sed 's/..\B/&:/g' | tr 'a-z' 'A-Z')
            EXPECTED_FINGERPRINT="76:AD:A6:29:EA:2A:12:C6:77:67:22:52:15:63:2B:19:F8:31:78:F3:4F:92:C2:79:E6:44:6E:BC:25:84:30:C1"
            echo "Detected Fingerprint: $CERT_FINGERPRINT"
            echo "Expected Fingerprint: $EXPECTED_FINGERPRINT"
            if [ "$(echo "$RAW_DIGEST" | tr 'a-z' 'A-Z')" != "$EXPECTED_RAW" ]; then
              echo "::error::Release cert fingerprint mismatch! Expected $EXPECTED_FINGERPRINT, got $CERT_FINGERPRINT"
              exit 1
            fi
            echo "Cert fingerprint matched official release key!"
          else
            echo "Transient keystore used for fork PR; skipping official fingerprint assertion."
          fi
      - name: Upload Sniffer APK
        uses: actions/upload-artifact@v4
        with:
          name: com.wx.sniffer-release
          path: release-assets/*.apk
          if-no-files-found: error
