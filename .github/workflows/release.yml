name: Release Artifacts

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Sniffer APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x android-module/gradlew

      - name: Setup Keystore (Official Keystore Required for Release)
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing! Release builds require official signing keystore."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Release APK
        working-directory: android-module
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Prepare Named Release Assets and Verify Signature
        run: |
          mkdir -p release-assets
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            TAG_NAME="${GITHUB_REF_NAME//\//-}"
          fi
          TAG_NAME="${TAG_NAME:-v1.0.4}"
          SRC_APK=$(ls android-module/app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ]; then
            echo "::error::Release APK not found in android-module/app/build/outputs/apk/release/"
            exit 1
          fi
          TARGET_APK="release-assets/wechat-pad-exporter-module-${TAG_NAME}.apk"
          cp "$SRC_APK" "$TARGET_APK"
          echo "Prepared asset: $TARGET_APK ($(ls -lh "$TARGET_APK" | awk '{print $5}'))"

          echo "Verifying APK Signature and Align..."
          APKSIGNER="apksigner"
          if ! command -v apksigner >/dev/null 2>&1; then
            APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | head -n 1)
          fi
          "$APKSIGNER" verify --verbose "$TARGET_APK"

          # Enforce zipalign 4-byte alignment
          ZIPALIGN="zipalign"
          if ! command -v zipalign >/dev/null 2>&1; then
            ZIPALIGN=$(find $ANDROID_HOME/build-tools/ -name zipalign | head -n 1)
          fi
          if [ -n "$ZIPALIGN" ] && [ -x "$ZIPALIGN" ]; then
            echo "Checking zipalign 4-byte alignment..."
            "$ZIPALIGN" -c -v 4 "$TARGET_APK"
            echo "Zipalign verification passed!"
          fi

          echo "Enforcing official release certificate fingerprint..."
          RAW_DIGEST=$("$APKSIGNER" verify --print-certs "$TARGET_APK" | grep -i "SHA-256 digest:" | head -1 | awk '{print $NF}' | tr -d ' :')
          EXPECTED_RAW="76ADA629EA2A12C67767225215632B19F83178F34F92C279E6446EBC258430C1"
          CERT_FINGERPRINT=$(echo "$RAW_DIGEST" | sed 's/..\B/&:/g' | tr 'a-z' 'A-Z')
          EXPECTED_FINGERPRINT="76:AD:A6:29:EA:2A:12:C6:77:67:22:52:15:63:2B:19:F8:31:78:F3:4F:92:C2:79:E6:44:6E:BC:25:84:30:C1"
          echo "Detected Fingerprint: $CERT_FINGERPRINT"
          echo "Expected Fingerprint: $EXPECTED_FINGERPRINT"
          if [ "$(echo "$RAW_DIGEST" | tr 'a-z' 'A-Z')" != "$EXPECTED_RAW" ]; then
            echo "::error::Release cert fingerprint mismatch! Expected $EXPECTED_FINGERPRINT, got $CERT_FINGERPRINT"
            exit 1
          fi
          echo "Fingerprint assertion PASSED!"

      - name: Upload Sniffer APK
        uses: actions/upload-artifact@v4
        with:
          name: com.wx.sniffer-release
          path: release-assets/*.apk
          if-no-files-found: error

  build-daemon:
    name: Cross Compile Daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: daemon/go.sum

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Daemon Tests
        working-directory: daemon
        run: |
          go test -v ./...

      - name: Build Android ARM64 Binary
        working-directory: daemon
        run: |
          mkdir -p ../dist
          TAG="${GITHUB_REF_NAME:-v1.0.4}"
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${TAG}" -o ../dist/wx_daemon-android-arm64 .

      - name: Build Linux AMD64 Binary
        working-directory: daemon
        run: |
          mkdir -p ../dist
          TAG="${GITHUB_REF_NAME:-v1.0.4}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${TAG}" -o ../dist/wx_daemon-linux-amd64 .
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wx_daemon-binaries
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-apk, build-daemon]
    runs-on: ubuntu-latest
    steps:
      - name: Download Sniffer APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: com.wx.sniffer-release
          path: release-dist

      - name: Download Daemon Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wx_daemon-binaries
          path: release-dist

      - name: Inspect and Verify Release Assets
        run: |
          echo "=== Release Assets to Publish ==="
          ls -la release-dist
          if [ ! -f release-dist/wx_daemon-android-arm64 ]; then
            echo "::error::Missing wx_daemon-android-arm64"
            exit 1
          fi
          if [ ! -f release-dist/wx_daemon-linux-amd64 ]; then
            echo "::error::Missing wx_daemon-linux-amd64"
            exit 1
          fi
          APK_COUNT=$(ls release-dist/*.apk 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -lt 1 ]; then
            echo "::error::No APK found in release-dist"
            exit 1
          fi

      - name: Create Release and Attach Artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release-dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            ## wechat-pad-exporter ${{ github.ref_name }}

            微信数据流导出工具套件，包含 Xposed Hook 模块 (`com.wx.sniffer`) 与 Go 高性能服务端 Daemon (`wx_daemon`)。

            ### 📦 构建产物 (Release Assets)
            - `wechat-pad-exporter-module-${{ github.ref_name }}.apk`: Xposed/LSPosed 数据嗅探模块
            - `wx_daemon-android-arm64`: Android 手机端本地运行的 Daemon 二进制
            - `wx_daemon-linux-amd64`: Linux x86_64 服务器端运行的 Daemon 二进制

            ---

            ### 🚀 快速安装与运行说明 (Quick Install Guide)

            #### 1. 安装 Xposed 嗅探模块 (Android)
            ```bash
            adb install wechat-pad-exporter-module-${{ github.ref_name }}.apk
            ```
            - 在 LSPosed 管理器中激活模块，勾选作用域为 **微信 (com.tencent.mm)**。
            - 强制停止微信并重新启动。

            #### 2. 在 Android 手机端部署并运行 Daemon (推荐)
            守护进程在手机端监听 Unix Domain Socket (`@wechat_stream_ipc`) 接收微信 hook 数据流并落库 SQLite。

            ```bash
            # A. 生成高强度鉴权 Token
            TOKEN=$(openssl rand -hex 32)
            echo "Your Bearer Token: $TOKEN"

            # B. 在手机上准备配置文件目录与配置
            adb shell "su -c 'mkdir -p /data/adb/wx_stream && chmod 700 /data/adb/wx_stream'"

            # 创建 config.json 并推送到设备 (参考仓库 daemon/config.example.json)
            cat <<JSON > /tmp/config.json
            {
              "bind": "127.0.0.1",
              "port": 8765,
              "uds_path": "@wechat_stream_ipc",
              "db_path": "/data/adb/wx_stream/vault.db",
              "token": "$TOKEN",
              "auth": true,
              "allow_chats": [],
              "block_chats": [],
              "log_file": "/data/adb/wx_stream/daemon.log",
              "log_max_bytes": 10485760,
              "log_keep": 3,
              "retain_days": 90
            }
            JSON
            adb push /tmp/config.json /data/local/tmp/config.json
            adb shell "su -c 'mv /data/local/tmp/config.json /data/adb/wx_stream/config.json && chmod 600 /data/adb/wx_stream/config.json'"

            # C. 推送 daemon 二进制并赋予执行权限
            adb push wx_daemon-android-arm64 /data/local/tmp/wx_daemon
            adb shell chmod 755 /data/local/tmp/wx_daemon

            # D. 启动 daemon (需 root 权限读取 UDS 与写入 /data/adb/)
            adb shell "su -c '/data/local/tmp/wx_daemon -config /data/adb/wx_stream/config.json &'"

            # E. 验证健康状态
            adb forward tcp:8765 tcp:8765
            curl -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/health
            ```

            > **开机自启与保活**：推荐使用仓库中的 `deploy/wx_autostart.sh` 与 `deploy/wx_watchdog.sh` 脚本放置于 `/data/adb/service.d/` (Magisk/KernelSU)，以获得开机自启、OOM 保护与进程守护。

            #### 3. 在 Linux 服务器运行 Daemon (存储/分析端)
            若仅作为独立服务端存储或解析：
            ```bash
            chmod +x wx_daemon-linux-amd64
            TOKEN=$(openssl rand -hex 32)

            # 命令行直接指定参数启动 (默认监听 127.0.0.1:8765)
            ./wx_daemon-linux-amd64 -http 127.0.0.1:8765 -db /path/to/vault.db -token "$TOKEN"
            # 或通过配置文件启动:
            # ./wx_daemon-linux-amd64 -config /path/to/config.json
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
